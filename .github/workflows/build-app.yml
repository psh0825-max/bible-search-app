name: Build Android app

on:
  push:
    branches: [master, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # KEYSTORE_BASE64 시크릿이 있으면 정식 업로드 키로 서명 (Play 업로드용 AAB에 필수).
      # 없으면 debug 키 fallback — APK 사이드로딩 테스트는 가능하지만 Play는 거부함.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-upload}" > android/key.properties
            echo "Release keystore restored."
          else
            echo "No keystore secrets — falling back to debug signing."
          fi

      - name: Build APK (지인 직접 공유용)
        run: >
          flutter build apk --release
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build AAB (Play Console 업로드용)
        run: >
          flutter build appbundle --release
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: malsseumchatgi-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: malsseumchatgi-aab
          path: build/app/outputs/bundle/release/app-release.aab
